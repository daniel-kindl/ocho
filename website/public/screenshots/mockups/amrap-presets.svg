<svg xmlns="http://www.w3.org/2000/svg" width="420" height="740" viewBox="0 0 420 740" role="img" aria-labelledby="title desc">
  <title id="title">Ocho AMRAP presets list</title>
  <desc id="desc">An Ocho AMRAP setup screen showing three distinct compact saved preset rows with total-duration summaries and delete actions.</desc>
  <defs>
    <clipPath id="screen-clip">
      <rect x="72" y="69" width="276" height="619" rx="25" />
    </clipPath>
  </defs>
  <g transform="rotate(-1.5 210 370)">
    <rect x="60" y="28" width="300" height="684" rx="36" fill="#080b0a" stroke="#4b5a52" stroke-width="2" />
    <image
      href="../v4/amrap-presets.png"
      x="72"
      y="69"
      width="276"
      height="619"
      preserveAspectRatio="none"
      clip-path="url(#screen-clip)"
    />
    <rect x="181" y="43" width="58" height="5" rx="2.5" fill="#101512" />
  </g>
</svg>
