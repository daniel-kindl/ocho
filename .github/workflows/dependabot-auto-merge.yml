name: dependabot-auto-merge

# Turns on auto-merge for a Dependabot pull request with a patch or a minor
# update. The required checks and the rules of the base branch still gate the
# merge. A major update waits for the owner. This workflow does not check out
# code and uses no secret.
#
# This file is a copy of the dkstack template. It runs only for pull requests
# to dev, the branch that dependabot.yml targets. A security update that
# Dependabot opens against main does not get auto-merge, because main changes
# only through a release. dev must require the CI checks, or the job stops
# with an error and nothing merges.

on:
  pull_request:
    branches: [dev]

permissions: {}

jobs:
  auto-merge:
    name: auto-merge
    # A Dependabot pull_request run gets a read-only token by default. The
    # job permissions below give it the write access to turn on auto-merge.
    # The actor check skips the run when a person pushes to the branch.
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Read the Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Turn on auto-merge for a patch or a minor update
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # gh merges at once when nothing blocks the pull request. So turn on
          # auto-merge only when a rule of the base branch blocks the merge,
          # for example a required check that has not passed yet.
          state=UNKNOWN
          for _ in 1 2 3 4 5 6; do
            state="$(gh pr view "$PR_URL" --json mergeStateStatus --jq .mergeStateStatus)"
            if [ "$state" != UNKNOWN ]; then break; fi
            sleep 10
          done
          case "$state" in
            BLOCKED | BEHIND) gh pr merge --auto --squash "$PR_URL" ;;
            *) echo "::error::The merge state is $state, not BLOCKED or BEHIND. Require the CI checks on the base branch first." >&2; exit 1 ;;
          esac
