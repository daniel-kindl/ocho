name: CodeQL

permissions: {}

# dev is where findings are meant to surface: it is scanned on every push and
# every PR, so a finding lands during review rather than after it. main is
# scanned as well, for a different reason — it is the default branch, which is
# the one the security tab reports against. Scanned only by the weekly cron, an
# alert fixed on dev stayed open on main for up to a week after the fix reached
# it, which is indistinguishable from a fix that did not work.
#
# The weekly schedule exists because CodeQL's query packs improve over time:
# code that scanned clean six months ago can have a finding today without any
# commit having touched it.
on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main, 'hardening/**' ]
  schedule:
    - cron: '17 5 * * 1'

jobs:
  analyze:
    name: Analyze Kotlin
    runs-on: ubuntu-latest
    permissions:
      # Writes findings to the repository's code scanning alerts.
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '17'
          distribution: 'temurin'

      # Kotlin is analysed by the `java-kotlin` pack, which needs real compilation:
      # a source-only scan would miss anything depending on resolved types.
      #
      # Manual rather than autobuild. Autobuild would reach for `gradle build`, which
      # here drags in the release variant, detekt and lint, all of which dev-ci.yml
      # already runs. assembleGithubDebug compiles the common code and GitHub updater.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew assembleGithubDebug --stacktrace

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          category: "/language:java-kotlin"

  analyze-actions:
    name: Analyze GitHub Actions
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          languages: actions

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          category: "/language:actions"
