name: Dev CI

permissions: {}

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev, main, 'hardening/**' ]
  workflow_dispatch:
    inputs:
      play_track:
        description: 'Google Play Closed-testing track name as shown in Play Console'
        required: true
        type: string

jobs:
  build-and-test:
    name: Build, Test & Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testGithubDebugUnitTest testPlayDebugUnitTest --stacktrace

      - name: Compile instrumentation tests for both flavors
        run: ./gradlew compileGithubDebugAndroidTestKotlin compilePlayDebugAndroidTestKotlin --stacktrace

      # Report-only, never gated. There is no coverage threshold anywhere in this
      # repository on purpose: a percentage is easy to move by writing tests that
      # touch lines without asserting anything, and gating rewards exactly that.
      #
      # koverLogGithubDebug prints the per-package breakdown, copied into the job summary
      # so it is visible during review without downloading anything. The aggregate
      # and the per-file detail live in the uploaded HTML report. See the kover block
      # in app/build.gradle.kts for what is excluded and why.
      - name: Measure coverage
        run: |
          set -euo pipefail
          ./gradlew koverLogGithubDebug koverXmlReportGithubDebug koverHtmlReportGithubDebug --stacktrace \
            | tee gradle-coverage.log
          {
            echo "## Coverage"
            echo
            echo '```'
            grep -E 'Line coverage by package|line coverage:' gradle-coverage.log
            echo '```'
            echo
            echo "Full report with per-file detail is in the \`coverage-report\` artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: |
            app/build/reports/kover/htmlGithubDebug/
            app/build/reports/kover/reportGithubDebug.xml
          retention-days: 7

      - name: Run detekt
        run: ./gradlew detekt --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleGithubDebug assemblePlayDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: debug-apk
          path: app/build/outputs/apk/github/debug/*.apk
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results
          path: app/build/reports/tests/
          retention-days: 7

  # Publishes a dev-channel build for every green push to `dev`, so changes can be
  # tested on a real device before they reach `main`. Lives in this workflow rather
  # than its own so it reuses the test and lint run above instead of repeating it.
  publish-dev:
    name: Publish Dev Prerelease
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Required by actions/attest-build-provenance: it mints an OIDC token to
      # prove the run's identity and writes the resulting attestation back to the
      # repository's attestation store.
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # The dev build is signed with the release key on purpose. CI's debug keystore
      # is regenerated per run, so consecutive dev APKs would be signed by different
      # keys and refuse to install over each other.
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64:-}" ]]; then
            echo "::error::Secret KEYSTORE_BASE64 is not set. Dev builds are signed with the release key so they can install over each other; see CONTRIBUTING.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/release.keystore"
          echo "KEYSTORE_FILE=${{ runner.temp }}/release.keystore" >> "$GITHUB_ENV"

      - name: Build signed dev APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          DEV_BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew assembleGithubDev -PdevBuildNumber="$DEV_BUILD_NUMBER" --stacktrace

      - name: Compute SHA-256 checksum
        id: checksum
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/github/dev/*.apk | head -n 1)
          # `sha256sum -c` resolves the path in the file relative to the working
          # directory, so the digest is generated from inside the APK's own
          # directory to keep the recorded name bare.
          (cd "$(dirname "$APK")" && sha256sum "$(basename "$APK")" > "$(basename "$APK").sha256")
          echo "SHA256_LINE=$(cat "${APK}.sha256")" >> "$GITHUB_OUTPUT"
          # Printed here on purpose. The job log is a second, independent record of
          # the digest: it is public, immutable once the run finishes, and not
          # editable the way a release asset is.
          echo "===== SHA-256 of the published APK ====="
          cat "${APK}.sha256"
          echo "========================================"

      # Ties the APK to this workflow run, this commit and this repository with a
      # signature users can check via `gh attestation verify`. Unlike the checksum,
      # this cannot be reproduced by someone who only controls the release assets.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: app/build/outputs/apk/github/dev/*.apk

      - name: Resolve dev version
        id: version
        env:
          DEV_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          BASE=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "TAG=v${BASE}-dev.${DEV_BUILD_NUMBER}" >> "$GITHUB_OUTPUT"

      # A prerelease, which is what keeps the channels apart: the stable app reads
      # releases/latest, and GitHub excludes prereleases from that endpoint entirely.
      #
      # Created as a draft and published in the next step, not in one go. GitHub makes
      # a release immutable the moment it is published, so a single-step publish
      # uploads the first asset and then fails on the second, leaving a release with
      # no downloads attached. Drafts stay writable, so all assets land first.
      - name: Create draft prerelease
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: "Ocho ${{ steps.version.outputs.TAG }}"
          body: |
            Development build from `dev` @ ${{ github.sha }}.

            Installs alongside the stable app as **Ocho Dev**. Not a supported
            release: expect it to be broken, and expect it to be replaced within
            the day.

            ## Verifying this download

            SHA-256 of the APK, also attached as a `.sha256` file and printed in
            the build log for [run ${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}):

            ```
            ${{ steps.checksum.outputs.SHA256_LINE }}
            ```

            Build provenance is attested. Verify it with:

            ```
            gh attestation verify <apk> --repo ${{ github.repository }}
            ```

            See [SECURITY.md](https://github.com/${{ github.repository }}/blob/main/SECURITY.md)
            for what each check does and does not prove.
          files: |
            app/build/outputs/apk/github/dev/*.apk
            app/build/outputs/apk/github/dev/*.apk.sha256
          draft: true
          prerelease: true
          make_latest: false

      # Publishing is what creates the tag and makes the APK downloadable. Kept
      # separate from the step above so every asset is attached before the release
      # becomes immutable.
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.TAG }}
        run: gh release edit "$RELEASE_TAG" --draft=false --prerelease

      # Without this the release list grows by one entry per push, forever.
      - name: Prune old dev prereleases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release list --limit 100 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease) | select(.tagName | test("-dev\\.")) | .tagName' \
            | tail -n +6 \
            | while read -r tag; do
                echo "Deleting old dev prerelease $tag"
                gh release delete "$tag" --cleanup-tag --yes
              done

  # This is the deliberate Play publishing gate. It only runs when the
  # maintainer manually dispatches Dev CI and supplies a Closed-testing track.
  publish-play-candidate:
    name: Publish Play Closed-Test Candidate
    needs: build-and-test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: play-upload
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate candidate branch
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" != "dev" ]]; then
            echo "::error::Play candidates must be run from the dev branch, not '$GITHUB_REF_NAME'."
            exit 1
          fi

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64:-}" ]]; then
            echo "::error::Secret KEYSTORE_BASE64 is not set. Add the signing secrets before publishing a Play candidate."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/release.keystore"
          echo "KEYSTORE_FILE=${{ runner.temp }}/release.keystore" >> "$GITHUB_ENV"

      - name: Build matching Play AAB and GitHub APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundlePlayRelease assembleGithubRelease --stacktrace

      - name: Retain matching candidate artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: play-closed-candidate-${{ github.run_number }}
          path: |
            app/build/outputs/bundle/playRelease/*.aab
            app/build/outputs/apk/github/release/*.apk
          retention-days: 14

      - name: Upload matching AAB to Closed testing
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.danielkindl.ocho
          releaseFiles: app/build/outputs/bundle/playRelease/app-play-release.aab
          tracks: ${{ inputs.play_track }}
          status: completed
          releaseName: "candidate-${{ github.run_number }}"
