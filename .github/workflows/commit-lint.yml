name: Commit Lint

permissions: {}

on:
  pull_request:
    branches: [dev, main, 'hardening/**']

jobs:
  commit-lint:
    name: Validate Conventional Commits
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate every commit message in this PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # https://www.conventionalcommits.org/en/v1.0.0/
          pattern='^(feat|fix|build|chore|ci|docs|style|refactor|perf|test|revert)(\([a-zA-Z0-9._-]+\))?!?: .+'

          failed=0
          while IFS= read -r line; do
            sha="${line%% *}"
            subject="${line#* }"

            if [[ "$subject" =~ ^Merge ]]; then
              continue
            fi

            if [[ ! "$subject" =~ $pattern ]]; then
              echo "::error::Commit $sha does not follow Conventional Commits: \"$subject\""
              failed=1
            fi
          done < <(git log --no-merges --pretty=format:"%H %s" "$BASE_SHA..$HEAD_SHA")

          if [[ "$failed" -ne 0 ]]; then
            echo "One or more commits do not follow https://www.conventionalcommits.org/en/v1.0.0/"
            exit 1
          fi
